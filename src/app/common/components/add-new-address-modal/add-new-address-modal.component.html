<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content">
    <div class="modal-header">
      <h1 class="modal-title fs-5" id="exampleModalLabel">{{ title }}</h1>
      <button #closeElem type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">
      <input-text-field
        [group]="formGroup"
        id="contactPersonName"
        [inputType]="InputType.text"
        [validators]="[Validators.required]"
        floatingLabel="Contact Name">
      </input-text-field>
      <mobile-number
        [group]="formGroup"
        mobileNumberId="contactPersonNumber"
        [validators]="[Validators.required]"
        floatingMobileLabel="Contact Number">
      </mobile-number>
      <input-text-field
        [group]="formGroup"
        id="contactAddress"
        [inputType]="InputType.text"
        [validators]="[Validators.required]"
        floatingLabel="Full Address">
      </input-text-field>
      <input-text-field
        [group]="formGroup"
        id="floorNumber"
        [appNumericOnly]="true"
        [validators]="[Validators.required]"
        floatingLabel="Floor number"
        [inputType]="InputType.text">
      </input-text-field>
      <input-text-field
        [group]="formGroup"
        id="houseNumber"
        [validators]="[Validators.required]"
        floatingLabel="House number">
      </input-text-field>
      <input-text-field
        [group]="formGroup"
        id="streetNumber"
        [validators]="[Validators.required]"
        floatingLabel="Street number">
      </input-text-field>
      <div *ngIf="deliveryInfoModel !== null">
        <div class="mt-4"></div>
        <div class="select-zone">
          <div class="dropdown w-100">
            <button class="btn dropdown-toggle zone-button"
                    type="button"
                    id="dropdownMenuButton1"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
              {{ selectedZone?.areaName ?? 'SELECT_ZIP_AREA_CODE' | translate }}
            </button>
            <ul class="dropdown-menu w-100" aria-labelledby="dropdownMenuButton1">
<!--              <form [formGroup]="form">-->
<!--                <input type="text" formControlName="search" class="form-control search-field"-->
<!--                       [placeholder]="'SEARCH_FOR' | translate">-->
<!--              </form>-->
              <li class="mt-2" *ngFor="let zone of deliveryInfoModel.deliveryChargeByArea" (click)="selectedZone = zone">
                <p class="dropdown-item">{{ zone.areaName }}</p>
              </li>
            </ul>
          </div>
        </div>
      </div>
      <primary-button
        (onClick)="updateAddress()"
        [enabled]="formGroup.valid && selectedZone !== null"
        [loading]="loading"
        title="{{title}}">
      </primary-button>
    </div>
  </div>
</div>
