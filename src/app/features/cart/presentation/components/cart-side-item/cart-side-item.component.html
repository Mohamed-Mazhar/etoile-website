<div class="container">
  <div class="cart-item-container">
    <div class="image-container">
      <img [src]="getImage()"/>
      <div class="not-available" *ngIf="!isAvailable">
        <p>{{ 'NOT_AVAILABLE' | translate }}</p>
      </div>
    </div>
    <div class="text-center">
      <p>{{ cartProduct.product.name }}</p>
      <div class="product-description"><p>{{ cartProduct.product.description }}</p></div>
      <div class="add-remove-cart-container">
        <div class="cart-button" [ngClass]="!isAvailable ? 'disabled' : ''" (click)="decreaseProduct()"><i class="fas fa-minus"></i></div>
        <div class="ms-3 me-3"><p>{{ cartProduct.count }}</p></div>
        <div class="cart-button" [ngClass]="!isAvailable ? 'disabled' : ''" (click)="increaseProduct()"><i class="fas fa-plus"></i></div>
      </div>
      <div class="price-container">
        <p>{{ 'PRICE' | translate }}:</p>
        <p>{{ getPrice() }} {{ configModel?.currencySymbol }}</p>
      </div>
    </div>
    <i data-bs-toggle="modal" data-bs-target="#deleteProduct" (click)="removeProduct(cartProduct)"
       class="fas fa-trash-alt delete-icon clickable"></i>
  </div>
  <div class="horizontal-separator" *ngIf="!hideSeparator"></div>
</div>
