<div class="scroll-container">
  <main-products-carousel
    *ngIf="banners.isNotEmpty()" [banners]="banners"
    [bannersUrl]="configModel?.baseUrls?.bannerImageUrl ?? ''">
  </main-products-carousel>
  <div class="banner-item"></div>

  <div class="banner-item image-container">
    <img class="img-fluid w-100"
         loading="lazy"
         src="https://linktsp.blob.core.windows.net/xretoile/246371f5-3a6e-4297-a125-8b3f9842c4c0-638473300556020330.png">
    <div class="overlay"></div>
  </div>

  <desserts
    *ngIf="showRecommended()"
    class="mb-4"
    [direction]="'left'"
    [productModel]="recommendedProducts"
    [imageSection]="'assets/images/home-asset/bg-section1.png'"
    [products]="chunkedRecommendedProducts"
    [titleSection]="'OUR ESPEICAL GATEAUX'">
  </desserts>

  <desserts
    *ngIf="bestSellerProducts !== null && bestSellerProducts.products!.isNotEmpty()"
    [direction]="'right'"
    [imageSection]="'assets/images/home-asset/bg-section2.png'"
    [products]="chunkedBestSellerProducts"
    [productModel]="bestSellerProducts"
    [titleSection]="'Best Seller'">
  </desserts>


  <div class="banner-item">
    <img alt="Bakeries"
         class="img-fluid w-100"
         loading="lazy"
         src="https://linktsp.blob.core.windows.net/xretoile/355f4491-2a5a-4032-a710-1cc313484648-638473297841348912.png">
  </div>

  <app-list-scroll-horizontal
    *ngIf="popularProducts !== null && popularProducts!.products!.isNotEmpty()"
    [items]="popularProducts"
    [title]="'MOST_TRENDY' | translate"
    [direction]="translateService.currentLang === 'en' ? 'left' : 'right' ">
  </app-list-scroll-horizontal>

  <app-list-scroll-horizontal
    *ngIf="latestProducts !== null && latestProducts!.products!.isNotEmpty()"
    [items]="latestProducts"
    [title]="'NEW_ARRIVALS' | translate"
    [direction]="translateService.currentLang === 'en' ? 'right': 'left'">
  </app-list-scroll-horizontal>

  <app-scroll-up-btn></app-scroll-up-btn>
  <div #openDelete data-bs-target="#deleteProduct" data-bs-toggle="modal">
  </div>
</div>
