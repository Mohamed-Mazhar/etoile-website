<div class="modal-container">
  <div #close class="modal-close-icon" data-bs-dismiss="offcanvas">
    <i class="fa fa-times"></i>
  </div>
  <div class="text-center container">
    <div class="forget-password-title">
      <h3>{{ 'FORGET_PASSWORD' | translate }}</h3>
    </div>
    <p>{{ 'FORGET_PASSWORD_SUBTITLE' | translate }}</p>
  </div>
  <div class="container mt-4">
    <div class="alert alert-danger form-alert" *ngIf="errorMessage !== null">{{ errorMessage }}</div>
    <input-text-field
      id="email"
      [group]="formGroup"
      [validators]="[Validators.required]"
      [floatingLabel]="'EMAIL' | translate">
    </input-text-field>
    <div class="mt-4">
      <primary-button
        (onClick)="forget()"
        [loading]="isLoading"
        [title]="'SEND' | translate"
        [enabled]="formGroup.valid">
      </primary-button>
    </div>
  </div>
</div>
