<div class="modal-container">
  <div #close class="modal-close-icon" data-bs-dismiss="offcanvas">
    <i class="fa fa-times"></i>
  </div>
  <div class="text-center container">
    <div class="forget-password-title">
      <h3>{{ 'FORGET_PASSWORD' | translate }}</h3>
    </div>
    <p>{{ 'FORGET_PASSWORD_SUBTITLE' | translate }}</p>
  </div>
  <div class="container mt-4">
    <div class="alert alert-danger form-alert" *ngIf="errorMessage !== null">{{ errorMessage }}</div>
    <div class="d-flex column-gap-4">
      <input-text-field
        id="email"
        *ngIf="!isMobileNumber"
        class="w-100"
        [group]="formGroup"
        [validators]="[Validators.required]"
        [floatingLabel]="'EMAIL' | translate">
      </input-text-field>
      <mobile-number
        countryCodeId="countryCode"
        mobileNumberId="loginMobile"
        class="w-100"
        *ngIf="isMobileNumber"
        [group]="formGroup"
        [validators]="[Validators.required]">
      </mobile-number>
      <div class="swap-icon mb-3" (click)="isMobileNumber = !isMobileNumber">
        <i class="fa fa-right-left"></i>
      </div>
    </div>
    <div class="mt-4">
      <primary-button
        (onClick)="forget()"
        [loading]="isLoading"
        [title]="'SEND' | translate"
        [enabled]="formGroup.valid">
      </primary-button>
    </div>
  </div>
</div>

<div #openVerification data-bs-toggle="offcanvas" data-bs-target="#verificationView"></div>
