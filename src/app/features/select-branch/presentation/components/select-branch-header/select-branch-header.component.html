<div class="select-branch-container">
  <div class="language-container" (click)="changeLanguage('ar')" *ngIf="currentLanguage === 'en'">
    <p>العربيه</p>
    <img loading="lazy" src="assets/images/egypt-flag.jpg">
  </div>
  <div class="language-container" (click)="changeLanguage('en')" *ngIf="currentLanguage === 'ar'">
    <p>English</p>
    <img loading="lazy" src="assets/images/usa-flag.png">
  </div>
  <div class="logo">
    <img loading="lazy" src="assets/images/logo.png" class="img-fluid">
  </div>
  <div class="user-action-container" *ngIf="userInfo === null">
    <div class="user-info-item-container" data-bs-toggle="offcanvas" data-bs-target="#loginView"
         aria-controls="loginView">
      <i class="fas fa-user icon-size"></i>
      <p>{{ 'LOGIN' | translate }}</p>
    </div>
    <div class="vertical-separator"></div>
    <div class="user-info-item-container" data-bs-toggle="offcanvas" data-bs-target="#registrationView"
         aria-controls="registrationView">
      <p>{{ 'REGISTER' | translate }}</p>
    </div>
  </div>
  <div class="user-info-item-container" *ngIf="userInfo !== null" data-bs-toggle="dropdown">
    <i class="fas fa-user icon-size"></i>
    <div class="d-flex align-items-center">
      <p>{{ 'WELCOME_USER' | translate }}, </p>
      <p class="username">{{ userInfo.fName }}</p>
    </div>
    <div class="dropdown-menu" aria-labelledby="userOptions">
      <div class="dropdown-item d-flex align-items-baseline clickable" routerLink="/profile">
        <i class="fas fa-user icon-size me-2"></i>
        <p>Profile</p>
      </div>
      <div class="logout-button clickable" (click)="logout()">
        <p>Logout</p>
      </div>
    </div>
  </div>
</div>

<div class="offcanvas offcanvas-start canvas-width" tabindex="-1" id="loginView" aria-labelledby="loginViewLabel">
  <app-login></app-login>
</div>

<div class="offcanvas offcanvas-start canvas-width" tabindex="-1" id="registrationView" aria-labelledby="registrationViewLabel">
  <app-registration></app-registration>
</div>

<div class="offcanvas offcanvas-start canvas-width" tabindex="-1" id="verificationView" aria-labelledby="verificationViewLabel">
  <app-verification></app-verification>
</div>

<div class="offcanvas offcanvas-start canvas-width" id="forgetPassword" tabindex="-1" aria-labelledby="forgetPasswordModalLabel" aria-hidden="true">
  <app-forget-password></app-forget-password>
</div>

<div class="offcanvas offcanvas-start canvas-width" tabindex="-1" id="resetPasswordView"
     aria-labelledby="resetPasswordViewLabel">
  <reset-password-modal></reset-password-modal>
</div>
